# The task board is changed by tools/repo/task.py straight on main (many small commits), so it has its own light check.
name: Task board

on:
  push:
    branches: [main]
    paths: ["tasks/**"]
  pull_request:
    paths: ["tasks/**"]

permissions:
  contents: read

jobs:
  check:
    name: tasks/*.md are valid
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: python tools/repo/task.py check
