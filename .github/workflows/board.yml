# The task board is changed by tools/repo/task.py straight on main (many small commits), so it has its own light check.
name: Task board

on:
  push:
    branches: [main]
    paths: ["tasks/**"]
  pull_request:
    paths: ["tasks/**"]

permissions:
  contents: read

jobs:
  check:
    name: tasks/*.md are valid
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: python tools/repo/task.py check
