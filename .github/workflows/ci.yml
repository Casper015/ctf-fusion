# Continuous integration: the same commands CONTRIBUTING.md tells you to run before a push.
# Matches that need the AI_Test engine run only when a read-only AI_TEST_TOKEN secret exists (job "pipeline").
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["tasks/**"]          # the task board is checked by board.yml
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  structure:
    name: Layout, board and links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Layout, task board and markdown links
        run: python -m unittest tests.test_repo_layout tests.test_task_board -v
      - name: Board files are valid
        run: python tools/repo/task.py check

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # Windows is the competition host's OS but has never run this suite in CI: informational until it is green.
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.10", experimental: false}   # oldest supported (README)
          - {os: ubuntu-latest, python: "3.13", experimental: false}   # x86-64: the AVX2/SSE2 kernels
          - {os: macos-latest, python: "3.13", experimental: false}    # arm64: the NEON kernels
          - {os: windows-latest, python: "3.13", experimental: true}   # the host's OS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: GNU g++ on macOS (the tests' fixture bots include <bits/stdc++.h>, which Apple clang lacks)
        if: runner.os == 'macOS'
        run: |
          brew install gcc
          echo "CXX=$(ls "$(brew --prefix)"/bin/g++-[0-9]* | sort -V | tail -1)" >> "$GITHUB_ENV"
      - name: Compiler
        shell: bash
        run: ${CXX:-g++} --version
      - name: Unit and contract tests
        run: python -m unittest discover -s tests -t . -v

  p-only:
    name: P-only bots (contract, replay, derive)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: P-only tests
        run: python -m unittest discover -s bots/p_only/tests -v

  torch:
    name: Torch backend parity (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: NumPy and PyTorch trainers agree
        run: python -m unittest tests.test_torch_backend -v

  pipeline:
    name: End-to-end pipeline (needs AI_Test)
    runs-on: ubuntu-latest
    continue-on-error: true            # not yet run in CI: informational until it is green
    timeout-minutes: 60
    env:
      AI_TEST_TOKEN: ${{ secrets.AI_TEST_TOKEN }}
      AI_TEST_REPO: ${{ vars.AI_TEST_REPO || 'Casper015/AI_Test' }}
    steps:
      - name: Is the AI_Test token configured?
        id: gate
        run: |
          if [ -n "$AI_TEST_TOKEN" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"
          else echo "::notice title=pipeline skipped::add a read-only AI_TEST_TOKEN secret (and optionally an AI_TEST_REPO variable) to run the 25 end-to-end tests"; echo "enabled=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.gate.outputs.enabled == 'true'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.gate.outputs.enabled == 'true'
        with:
          repository: ${{ env.AI_TEST_REPO }}
          token: ${{ secrets.AI_TEST_TOKEN }}
          path: ai_test
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        if: steps.gate.outputs.enabled == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - if: steps.gate.outputs.enabled == 'true'
        run: python -m pip install -r requirements-dev.txt
      - name: Tests with the engine
        if: steps.gate.outputs.enabled == 'true'
        env:
          AI_TEST_ROOT: ${{ github.workspace }}/ai_test
        run: python -m unittest discover -s tests -t . -v
