# Continuous integration: the same commands CONTRIBUTING.md tells you to run before a push.
# The end-to-end tests run against the public engine repository chen-006/meow-ai-arena, pinned to a commit below.
# No secret is needed. Bump the pin on purpose, in its own commit, when the engine or the judge bots change.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["tasks/**"]          # the task board is checked by board.yml
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  structure:
    name: Layout, board and links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Layout, task board and markdown links
        run: python -m unittest tests.test_repo_layout tests.test_task_board -v
      - name: Board files are valid
        run: python tools/repo/task.py check

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # Windows is the competition host's OS but has never run this suite in CI: informational until it is green.
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.10", experimental: false}   # oldest supported (README)
          - {os: ubuntu-latest, python: "3.13", experimental: false}   # x86-64: the AVX2/SSE2 kernels
          - {os: macos-latest, python: "3.13", experimental: false}    # arm64: the NEON kernels
          - {os: windows-latest, python: "3.13", experimental: true}   # the host's OS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: GNU g++ on macOS (the tests' fixture bots include <bits/stdc++.h>, which Apple clang lacks)
        if: runner.os == 'macOS'
        run: |
          brew install gcc
          echo "CXX=$(ls "$(brew --prefix)"/bin/g++-[0-9]* | sort -V | tail -1)" >> "$GITHUB_ENV"
      - name: Compiler
        shell: bash
        run: ${CXX:-g++} --version
      - name: Unit and contract tests
        run: python -m unittest discover -s tests -t . -v

  p-only:
    name: P-only bots (contract, replay, derive)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: chen-006/meow-ai-arena
          ref: 54139d4ebf723fb5b6a25044d242dd0575eceaf1
          path: arena
          sparse-checkout: ctf
      - run: python -m pip install -r requirements-dev.txt
      - name: P-only tests (the ones that need the engine run too)
        env:
          AI_TEST_ROOT: ${{ github.workspace }}/arena
        run: python -m unittest discover -s bots/p_only/tests -v

  torch:
    name: Torch backend parity (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: NumPy and PyTorch trainers agree
        run: python -m unittest tests.test_torch_backend -v

  pipeline:
    name: End-to-end pipeline (public engine)
    runs-on: ubuntu-latest
    continue-on-error: true            # informational until its first green run on main
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: chen-006/meow-ai-arena
          ref: 54139d4ebf723fb5b6a25044d242dd0575eceaf1                   # pinned: a moving engine would move the tests with it
          path: arena
          sparse-checkout: ctf
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Tests with the engine and the judge bots
        env:
          AI_TEST_ROOT: ${{ github.workspace }}/arena
        # Three tests skip by design: the legacy planner (q_H) and the Player5 reference bot exist only in
        # the AI_Test working tree on the host.
        run: python -m unittest discover -s tests -t . -v
