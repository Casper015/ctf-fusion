# Delivery: package every P-only variant as the single file a judge compiles, check that it compiles, and (on request)
# attach the lot, with SHA-256 hashes, to a GitHub release. Runs on every change to the bots or to what they include.
name: Bots

on:
  push:
    branches: [main]
    paths: ["bots/**", "inference/**", "fusion/runner.py", "tools/repo/release_bots.py", ".github/workflows/bots.yml"]
  pull_request:
    paths: ["bots/**", "inference/**", "fusion/runner.py", "tools/repo/release_bots.py", ".github/workflows/bots.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub release with the bundles (main only)"
        type: boolean
        default: false
      only:
        description: "Variant names, space separated (empty = every variant)"
        type: string
        default: ""

concurrency:
  group: bots-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  bundles:
    name: Bundle and compile every variant
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ONLY: ${{ inputs.only }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - name: Package (and -fsyntax-only every bundle)
        run: |
          args=()
          if [ -n "$ONLY" ]; then args=(--only $ONLY); fi
          python tools/repo/release_bots.py --out dist --check --jobs 2 "${args[@]}"
      - name: Verify the listing
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: bots-${{ github.sha }}
          path: dist/
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publish release
    needs: bundles
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: bots-${{ github.sha }}
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          tag="bots-$(date -u +%Y%m%d)-${SHA::7}"
          python3 - <<'PY' > notes.md
          import json
          m = json.load(open("dist/MANIFEST.json"))
          print(f"Bundled P-only bots from commit `{m['commit'][:10]}`. Each file is the single `.cpp` a judge compiles, gzip-compressed.\n")
          print("```sh\nsha256sum -c SHA256SUMS\ngunzip c08_ponly_xxl.cpp.gz\ng++ -std=c++20 -O2 c08_ponly_xxl.cpp -o c08_ponly_xxl\n```\n")
          print("`sha256` below is of the uncompressed bundle (the identity in MANIFEST.json). A screen manifest hashes `#define PONLY_STATS 1` + the bundle.\n")
          print("| variant | carrier | role | size | MB (uncompressed) | sha256 |\n|---|---|---|---|---:|---|")
          for n, e in m["variants"].items():
              print(f"| `{n}` | {e.get('carrier','')} | {e.get('role','')} | {e.get('tier') or '-'} | {e['bytes']/1e6:.2f} | `{e['sha256'][:16]}` |")
          PY
          gh release create "$tag" dist/*.gz dist/MANIFEST.json dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "Bots $tag" --notes-file notes.md
